<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.9 - Formularios HTML</title>
</head>
<body>
    <form action="index.html" method="get">
        <fieldset>
            <legend>Datos personales by Ernesto</legend>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required autofocus size="30" maxlength="40">

            <label for="contrasena">Contraseña:</label>
            <input type="password" id="contrasena" name="contrasena" minlength="8">

            <label for="correo">Correo:</label>
            <input type="email" id="correo" name="correo" required>

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" pattern="[0-9]{9}">

            <label for="fecha-nacimiento">Fecha de nacimiento:</label>
            <input type="date" id="fecha-nacimiento" name="fecha-nacimiento">

            <label for="foto">Foto:</label>
            <input type="file" id="foto" name="foto">

            <label for="curso">Curso:</label>
            <input type="text" id="curso" name="curso" value="2026-27" readonly>

            <label for="centro">Centro:</label>
            <input type="text" id="centro" name="centro" value="IES La Asunción" disabled>
        </fieldset>
        <fieldset>
            <legend>Preferencias</legend>
            <p>Turno:</p>
            <input type="radio" id="turno-manana" name="turno" value="manana">
            <label for="turno-manana">Mañana</label>
            <input type="radio" id="turno-tarde" name="turno" value="tarde">
            <label for="turno-tarde">Tarde</label>

            <p>Intereses:</p>
            <input type="checkbox" id="interes-deporte" name="intereses" value="deporte">
            <label for="interes-deporte">Deporte</label>
            <input type="checkbox" id="interes-musica" name="intereses" value="musica">
            <label for="interes-musica">Música</label>
            <input type="checkbox" id="interes-lectura" name="intereses" value="lectura">
            <label for="interes-lectura">Lectura</label>

            <label for="horas-estudio">Horas de estudio:</label>
            <input type="number" id="horas-estudio" name="horas-estudio" min="0" max="10" step="2">

            <label for="nivel">Nivel:</label>
            <input type="range" id="nivel" name="nivel" min="1" max="10">

            <label for="color-favorito">Color favorito:</label>
            <input type="color" id="color-favorito" name="color-favorito">

            <label for="hora">Hora:</label>
            <input type="time" id="hora" name="hora">

            <label for="semana">Semana:</label>
            <input type="week" id="semana" name="semana">

            <label for="mes">Mes:</label>
            <input type="month" id="mes" name="mes">

            <label for="modulos">Módulos:</label>
            <select id="modulos" name="modulos" multiple>
                <optgroup label="Formación básica">
                    <option value="lengua" selected>Lengua</option>
                    <option value="matematicas">Matemáticas</option>
                </optgroup>
                <optgroup label="Formación específica">
                    <option value="programacion">Programación</option>
                    <option value="bases-de-datos">Bases de datos</option>
                </optgroup>
            </select>

            <label for="comentarios">Comentarios:</label>
            <textarea id="comentarios" name="comentarios" rows="4" cols="40"></textarea>
        </fieldset>
    </form>
</body>
</html>
